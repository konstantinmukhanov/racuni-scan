<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сканер чеков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1b1b1d);
      --hint: var(--tg-theme-hint-color, #8a8a8e);
      --btn: var(--tg-theme-button-color, #1f7a5a);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 8px; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { margin: 0 0 20px; color: var(--hint); max-width: 320px; }
    button {
      appearance: none; border: 0; border-radius: 12px; padding: 14px 22px; min-width: 240px;
      background: var(--btn); color: var(--btn-text); font: 600 16px/1 inherit; cursor: pointer;
    }
    .error { color: #c2453b; }
  </style>
</head>
<body>
  <div class="icon" id="icon">📷</div>
  <h1 id="title">Сканер чеков</h1>
  <p id="text">Наведите камеру на QR-код фискального чека.</p>
  <button id="scan" type="button">Сканировать</button>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const $ = (id) => document.getElementById(id);
    const RECEIPT = /https?:\/\/suf\.purs\.gov\.rs\/v\/?\?vl=/i;

    function show(icon, title, text, isError) {
      $('icon').textContent = icon;
      $('title').textContent = title;
      $('text').textContent = text;
      $('text').className = isError ? 'error' : '';
    }

    function scan() {
      if (!tg || !tg.showScanQrPopup) {
        show('⚠️', 'Откройте из Telegram', 'Эта страница работает только как кнопка «📷 Сканировать чек» в боте.', true);
        return;
      }
      tg.showScanQrPopup({ text: 'Наведите на QR-код чека' }, (data) => {
        if (!data) return false;
        if (!RECEIPT.test(data)) {
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
          show('🤔', 'Это не чек', 'QR-код не похож на сербский фискальный чек. Попробуйте ещё раз.', true);
          return true; // закрыть сканер, показать подсказку
        }
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        show('✅', 'Отправляю…', 'Чек уходит боту.');
        // sendData закрывает мини-приложение и передаёт ссылку боту
        setTimeout(() => tg.sendData(data.trim()), 50);
        return true;
      });
    }

    $('scan').addEventListener('click', scan);

    if (tg) {
      tg.ready();
      tg.expand();
      // сразу открываем камеру — одним касанием меньше
      scan();
    } else {
      show('⚠️', 'Откройте из Telegram', 'Эта страница — кнопка сканера для бота Računi.', true);
    }
  </script>
</body>
</html>
